name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            name: macOS (clang)
          - os: ubuntu-latest
            name: Ubuntu (gcc)
          - os: ubuntu-latest
            name: Ubuntu (clang)
            cc: clang

    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Build
        run: make CC="${CC:-cc}"
        env:
          CC: ${{ matrix.cc }}

      - name: Test
        run: make CC="${CC:-cc}" test
        env:
          CC: ${{ matrix.cc }}

      - name: Test with AddressSanitizer + UBSan
        run: |
          make clean
          make CC="${CC:-cc}" CFLAGS="-O2 -g -fsanitize=address,undefined -fno-omit-frame-pointer" test
          echo "ASan+UBSan: clean"
        env:
          CC: ${{ matrix.cc }}
