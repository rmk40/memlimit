name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release (e.g. 1.1.0)"
        required: true

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.pin.outputs.sha }}

    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Pin SHA for all subsequent jobs
        id: pin
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Validate version
        run: |
          VERSION="${{ github.event.inputs.version }}"

          if ! echo "$VERSION" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::Invalid version format: $VERSION (expected X.Y.Z)"
            exit 1
          fi

          if git rev-parse "v$VERSION" >/dev/null 2>&1; then
            echo "::error::Tag v$VERSION already exists"
            exit 1
          fi

      - name: Bump version locally and verify build
        run: |
          VERSION="${{ github.event.inputs.version }}"

          sed -i'' -e "s/#define VERSION.*/#define VERSION           \"$VERSION\"/" memlimit.c

          grep -q "\"$VERSION\"" memlimit.c || {
            echo "::error::Failed to update VERSION in memlimit.c"
            exit 1
          }

          make test
          ./memlimit --version | grep -q "$VERSION"

  test:
    needs: validate
    strategy:
      fail-fast: true
      matrix:
        include:
          - os: macos-latest
            name: macOS (clang)
          - os: ubuntu-latest
            name: Ubuntu (gcc)

    name: test (${{ matrix.name }})
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.validate.outputs.sha }}

      - name: Bump version and test
        run: |
          VERSION="${{ github.event.inputs.version }}"
          sed -i'' -e "s/#define VERSION.*/#define VERSION           \"$VERSION\"/" memlimit.c
          make test
          ./memlimit --version | grep -q "$VERSION"

  tag-and-publish:
    needs: [validate, test]
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.validate.outputs.sha }}

      - name: Bump version, commit, tag, and push
        run: |
          VERSION="${{ github.event.inputs.version }}"

          # Checkout leaves detached HEAD; create a local main branch.
          git checkout -B main

          sed -i'' -e "s/#define VERSION.*/#define VERSION           \"$VERSION\"/" memlimit.c

          grep -q "\"$VERSION\"" memlimit.c || {
            echo "::error::Failed to update VERSION in memlimit.c"
            exit 1
          }

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add memlimit.c
          git commit -m "chore: bump version to $VERSION"
          git tag "v$VERSION"
          git push --atomic origin main "v$VERSION"

      - name: Create GitHub release
        run: |
          gh release create "v${{ github.event.inputs.version }}" \
            --title "v${{ github.event.inputs.version }}" \
            --generate-notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Update Homebrew tap
        run: make update-tap VERSION="${{ github.event.inputs.version }}"
        env:
          GH_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
